# Format der Zeile im Tooltip (MiniMessage). <rarity> wird durch den display-Text ersetzt.
line-format: "<dark_gray>Seltenheit: <rarity>"

# Animation: Farbverlauf "wandert" waehrend eine Kiste/GUI offen ist (Phase = %phase%).
# Im normalen Spieler-Inventar (E) ist der Verlauf statisch, Minecraft meldet dem Server dort kein "Oeffnen".
animation:
  enabled: true
  interval-ticks: 3     # alle 3 Ticks aktualisieren (20 Ticks = 1 Sekunde)
  speed: 0.15           # Geschwindigkeit der Welle

# default-rarity: Alles ohne Treffer bekommt diese Stufe.
default-rarity: common

# Reihenfolge = von niedrig nach hoch. Bei Treffern in mehreren Stufen gewinnt die hoehere.
# materials: exakter Name, "PRAEFIX_*" oder "*_SUFFIX".
# glint: true = Item schimmert wie verzaubert (auch in der Hand sichtbar).
# animated: true = Farbverlauf der Schrift bewegt sich (display muss %phase% enthalten).
rarities:

  common:
    display: "<bold><gradient:#9e9e9e:#ffffff>COMMON"

  uncommon:
    display: "<bold><gradient:#55ff55:#00aa77>UNCOMMON"
